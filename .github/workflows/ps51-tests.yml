name: ps51-tests

on:
  workflow_dispatch:
  push:
    branches: [claude/5003-ps51-tests]

permissions:
  contents: read

jobs:
  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows PowerShell version
        shell: powershell
        run: |
          Write-Output ('PSVersion: ' + $PSVersionTable.PSVersion + ' ' + $PSVersionTable.PSEdition)
          Write-Output ('powershell: ' + (Get-Command powershell).Source)
          Write-Output ('pwsh: ' + (Get-Command pwsh).Source)
          Get-ExecutionPolicy -List | Out-String | Write-Output

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Override tests under pwsh and Windows PowerShell 5.1
        run: uv run pytest tests/extensions/git/test_git_extension.py -k "git_branch_name_override and PowerShell" -p no:cacheprovider -rs

      - name: Whole suite as CI runs it
        run: uv run pytest -n auto
